name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch upstream libimobiledevice changes that break the build
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh
      - name: Python syntax
        run: python3 -m py_compile bin/idr-doctor bin/idr-gui
      - name: idr-doctor explain smoke test
        run: |
          printf 'ERROR: TSS request failed (status=94, message=x)\nERROR: Unable to get SHSH blobs for this device\n' \
            | python3 bin/idr-doctor explain | grep -q "status 94"

  install:
    name: install (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
    container: ${{ matrix.image }}
    steps:
      - name: Prerequisites for checkout
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y git
          elif command -v dnf >/dev/null; then dnf install -y git
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm git
          elif command -v zypper >/dev/null; then zypper --non-interactive install git tar gzip
          fi
      - uses: actions/checkout@v4
      - name: Run installer
        run: bash ./install.sh -y --remove-distro-packages
      - name: Verify
        run: |
          /usr/local/bin/idevicerestore --version
          /usr/local/bin/irecovery --version || true
          ldd /usr/local/bin/idevicerestore | grep libtatsu
          python3 /usr/local/bin/idr-doctor device || true
      - name: Show build log on failure
        if: failure()
        run: tail -n 100 /var/log/idevicerestore-setup.log || true
